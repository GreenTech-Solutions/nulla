[space-location-name]
nulla=Nulla

[space-location-description]
nulla=A small moon of the ice giant Aquilo, shrouded in a dense carbon atmosphere. Its surface is scarred by nuclear craters and the ruins of a civilization that vanished under unknown circumstances. The war ended long before your arrival, yet its legacy endures: autonomous combat drones still patrol the surface, responding to any unfamiliar radio transmissions. Despite the faint light of its distant star, the moon retains enough heat to avoid being locked beneath eternal ice. However, its corrosive atmosphere renders conventional inserters useless.


