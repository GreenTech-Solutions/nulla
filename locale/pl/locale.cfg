[space-location-description]
nulla=Mały księżyc lodowego giganta Aquilo, spowity gęstą atmosferą węglową. Jego powierzchnia jest pokryta kraterami jądrowymi i ruinami cywilizacji, która zniknęła w nieznanych okolicznościach. Wojna zakończyła się na długo przed twoim przybyciem, jednak jej dziedzictwo trwa: autonomiczne drony bojowe wciąż patrolują powierzchnię, reagując na wszelkie nieznane sygnały radiowe. Pomimo słabego światła odległej gwiazdy księżyc zachowuje wystarczającą ilość ciepła, by uniknąć uwięzienia pod wiecznym lodem. Jednak jego korozyjna atmosfera sprawia, że konwencjonalne podajniki są bezużyteczne.


