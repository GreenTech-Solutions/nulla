[space-location-description]
nulla=Небольшой спутник ледяного гиганта Аквило, окутанный плотной углеродной атмосферой. Его поверхность испещрена ядерными кратерами и руинами цивилизации, исчезнувшей при неизвестных обстоятельствах. Война закончилась задолго до вашего прибытия, но её наследие продолжает существовать: автономные боевые дроны до сих пор патрулируют поверхность, реагируя на любые инородные радиоволны. Несмотря на слабое излучение далёкой звезды, спутник сохраняет достаточно тепла, чтобы не покрыться вечным льдом. Однако, едкая атмосфера делает обычные манипуляторы бесполезными.


